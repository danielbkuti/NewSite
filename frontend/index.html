<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fauxcus tab icon — B (starfield tile) per logo-outline-handoff.md's
         own reasoning: the dark tile holds its own square against white
         browser chrome, where A's pale gradient corner would dissolve into
         it. A is used for the touch/home-screen icon below instead, where
         the surrounding ground is unknown and the brighter tile carries
         better. 32/16 are resampled down from the 512 master, not left for
         the browser to downscale itself. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-b-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-b-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-b-16.png" />
    <link rel="apple-touch-icon" href="/icon-a-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fauxcus</title>

    <!-- Google Fonts: Lato (product UI), Sora (logo wordmark / eyebrow labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
